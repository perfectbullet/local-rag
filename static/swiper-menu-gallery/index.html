<!DOCTYPE html>
<html lang="zh" style="height: 100%">
<head>
  <meta charset="UTF-8">
  <title>图片预览</title>
  <style>
    .img-wrap{
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      position: relative;
      height: 100%;
      overflow-y: auto;
      align-content: baseline;
    }
    .img-wrap .img-item{
      width:200px;
      margin-bottom:10px;
    }
    .img-wrap .img-item img{
      width:100%;
      height: 100%;
      max-height: 140px;
    }
    .img-wrap .img-item.active img{
      position: fixed;
      left:0;
      top:0;
      width: auto;
      max-height: max-content;
      height: auto;
    }
    .img-item-title{
      margin-top:10px;
    }
  </style>
</head>
<body style="height: 100%">
<div class="img-wrap">
  {% for item in items %}
    <div class="img-item" >
      <img src="{{ item.url }}"/>
       <div class="img-item-title">{{ item.imagename }}</div>
    </div>
  {% endfor %}
</div>
<script>
  let imgItems = document.querySelectorAll(".img-item");
  imgItems.forEach(item => {
    item.addEventListener("click",()=>{
      if(hasClass(item,'active')){
        item.classList.remove('active')
      }else{
        item.classList.add('active')
      }
    })
  })

  function hasClass(element, className) {
    return element.classList.contains(className);
  }

</script>
<!-- partial -->
  
</body>
</html>
